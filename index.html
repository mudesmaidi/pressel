<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geovana</title>

  <style>
    :root {
      --wa-green: #25D366;
      --wa-green-dark: #1ebe5b;
      --card-bg: rgba(17, 27, 33, 0.92);
      --text: #e9edef;
      --muted: #8696a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0b141a;
      position: relative;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url("fundo.jpg") center center / cover no-repeat;
      z-index: 0;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border-radius: 22px;
      max-width: 360px;
      width: calc(100% - 32px);
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .avatar-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
      color: #fff;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 14px;
      color: #25D366;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: #25D366;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.25);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.25); }
      50% { box-shadow: 0 0 0 6px rgba(37, 211, 102, 0.12); }
    }

    .btn {
      display: block;
      width: 100%;
      background: var(--wa-green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      border: none;
      border-radius: 12px;
      padding: 16px 14px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: background 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }

    .btn:hover {
      background: var(--wa-green-dark);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn .sub {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      opacity: 0.95;
      letter-spacing: 0.5px;
    }

    .distance {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .distance svg {
      width: 14px;
      height: 14px;
      fill: var(--muted);
      flex-shrink: 0;
    }

    .footer {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      z-index: 5;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
      padding: 0 16px;
    }

    .footer a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: underline;
    }

    .redirect-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0b141a;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }

    .redirect-screen.active {
      display: flex;
    }

    .redirect-card {
      background: #111b21;
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .redirect-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: var(--wa-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .redirect-icon svg {
      width: 38px;
      height: 38px;
      fill: #fff;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-msg {
      font-size: 16px;
      font-weight: 600;
      color: #e9edef;
    }

    .redirect-btn {
      display: none;
      width: 100%;
      margin-top: 22px;
      background: var(--wa-green);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .redirect-btn:hover {
      background: var(--wa-green-dark);
    }

    @media (max-width: 380px) {
      .card {
        padding: 28px 18px 24px;
      }
      .btn {
        font-size: 13px;
        padding: 14px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="card" id="mainCard">
    <div class="avatar-wrap">
      <img src="perfil.jpg" alt="Geovana" width="96" height="96">
    </div>

    <div class="name">Geovana</div>

    <div class="status">
      <span class="status-dot"></span>
      Online agora...
    </div>

    <a href="#" class="btn" id="waBtn">
      ENVIE UMA MENSAGEM PARA ELA<br>AGORA NO WHATSAPP...
      <span class="sub">CLIQUE AQUI</span>
    </a>

    <div class="distance" id="distance">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      <span id="kmText">A 12 km de você</span>
    </div>
  </div>

  <div class="redirect-screen" id="redirectScreen">
    <div class="redirect-card">
      <div class="redirect-icon">
        <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.11c-.24.68-1.4 1.32-1.93 1.36-.52.05-1 .24-3.42-.74-2.9-1.18-4.75-4.12-4.9-4.31-.14-.19-1.17-1.56-1.17-2.98s.73-2.12.99-2.41c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.42-.07.65.5.24.58.81 2 .88 2.15.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.37-.43.5-.14.14-.29.29-.12.57.17.29.75 1.24 1.61 2.01 1.11 1 2.05 1.31 2.33 1.46.29.14.46.12.63-.07.17-.19.71-.83.9-1.12.19-.29.38-.24.64-.14.26.1 1.66.78 1.94.93.29.14.48.21.55.33.07.12.07.69-.17 1.37z"/></svg>
      </div>
      <div class="redirect-msg" id="statusMsg">
        <span class="spinner"></span>Estamos te redirecionando...
      </div>
      <a href="#" class="redirect-btn" id="fallbackBtn">Chamar no WhatsApp</a>
    </div>
  </div>

  <div class="footer">
    © 2025 Gi Cardoso – Todos os direitos reservados.<br>
    <a href="#">Política de Privacidade</a> | <a href="#">Termos de Uso</a>
  </div>

  <script>
    const numeros = [
      "573189163875",
      "573150153957",
      "573225537874",
      "573169865530",
      "573025769374",
      "573151961563",
      "573178053354",
      "573026559129",
      "573196488137",
      "573238198995",
      "573008110530",
      "573247587666",
      "573155072403",
      "573241475735",
      "573007037785",
      "573505534712",
      "573188916656",
      "573044182500",
      "573160942457",
      "573238297399",
      "573249818810",
    ];

    const mensagem = "";

    function gerarKmProximo() {
      const km = Math.floor(Math.random() * 28) + 1;
      return km;
    }

    function getNumeroRotacionado() {
      const index = Math.floor(Math.random() * numeros.length);
      return numeros[index];
    }

    const km = gerarKmProximo();
    document.getElementById("kmText").textContent = "A " + km + " km de você";

    const numeroEscolhido = getNumeroRotacionado();
    const linkWhatsapp = "https://api.whatsapp.com/send?phone=" + numeroEscolhido +
      (mensagem ? "&text=" + encodeURIComponent(mensagem) : "");

    const waBtn = document.getElementById("waBtn");
    const fallbackBtn = document.getElementById("fallbackBtn");
    const redirectScreen = document.getElementById("redirectScreen");
    const statusMsg = document.getElementById("statusMsg");
    const mainCard = document.getElementById("mainCard");

    function iniciarRedirect(e) {
      if (e) e.preventDefault();

      if (typeof fbq === "function") {
        fbq("track", "Contact");
      }

      mainCard.style.display = "none";
      redirectScreen.classList.add("active");

      setTimeout(function () {
        window.location.href = linkWhatsapp;
      }, 1600);

      setTimeout(function () {
        statusMsg.style.display = "none";
        fallbackBtn.style.display = "block";
        fallbackBtn.setAttribute("href", linkWhatsapp);
      }, 3200);
    }

    waBtn.addEventListener("click", iniciarRedirect);

    fallbackBtn.addEventListener("click", function (e) {
      e.preventDefault();
      window.location.href = linkWhatsapp;
    });
  </script>
</body>
</html>
